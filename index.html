<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><title>高中生成绩分析工具</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="hero"><p class="eyebrow">STUDENT SCORE ANALYZER 2.0</p><h1>高中生成绩分析</h1><p class="subtitle">设置每科满分，录入成绩，或导入 Excel 自动排名</p></header><section class="summary-grid"><div class="summary-card"><span>我的总分</span><strong id="totalScore">0</strong></div><div class="summary-card"><span>平均分</span><strong id="averageScore">0.0</strong></div><div class="summary-card"><span>排名</span><strong id="myRank">—</strong></div></section><section class="panel"><div class="section-title"><div><h2>我的成绩</h2><p>每科满分可以自由设置</p></div><button id="addSubjectBtn" class="primary-btn" type="button">＋ 添加科目</button></div><div class="table-head"><span>科目</span><span>满分</span><span>成绩</span><span></span></div><div id="subjectList"></div><div id="emptySubjects" class="empty-state">还没有科目，请添加科目</div></section><section class="panel"><div class="section-title"><div><h2>薄弱科目分析</h2><p>按得分率判断，不只比较原始分数</p></div></div><div id="weakAnalysis" class="analysis-box">填写成绩后自动分析</div></section><section class="panel"><div class="section-title"><div><h2>同学成绩排名</h2><p>导入没有排名的 Excel，软件自动计算</p></div></div><label class="upload-box" for="excelInput"><span class="upload-icon">📊</span><strong>选择 Excel 文件</strong><small>支持 .xlsx / .xls / .csv</small></label><input id="excelInput" type="file" accept=".xlsx,.xls,.csv" hidden><div id="importStatus" class="status"></div><div id="rankPanel" class="rank-panel"></div></section><section class="panel"><h2>数据说明</h2><p class="muted">Excel 第一张工作表会被读取。第一行应是表头，并且科目名称要与上面的科目名称一致。成绩文件只在浏览器本地解析，不需要数据库。</p><button id="clearBtn" class="clear-btn" type="button">清空本机保存的数据</button></section><footer>本工具不需要登录或数据库</footer></main><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script src="script.js"></script></body></html>
