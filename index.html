<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>班主任班级成绩分析系统</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><header><h1>班主任班级成绩分析系统</h1><p>单班成绩导入、排名、分段与学生分析</p></header>
<section class="panel"><h2>① 导入全班成绩</h2><input id="file" type="file" accept=".xlsx,.xls,.csv"><p id="status" class="muted">支持 Excel / CSV。第一行为表头，至少需要“姓名”和各科成绩列。</p></section>
<section id="overview" class="hidden"><div class="stats" id="stats"></div><div class="panel"><h2>班级总览</h2><div id="subjectOverview"></div></div>
<div class="panel"><h2>成绩分段统计</h2><div id="distribution"></div></div>
<div class="panel"><h2>重点关注学生</h2><div id="attention"></div></div>
<div class="panel"><h2>全班总分排名</h2><div class="table-wrap"><table id="rankTable"></table></div></div>
<div class="panel"><h2>学生查询</h2><input id="studentName" placeholder="输入学生姓名"><button id="searchBtn">查询</button><div id="studentDetail"></div></div>
<div class="panel"><h2>单科成绩排名</h2><select id="subjectSelect"></select><div class="table-wrap"><table id="subjectRankTable"></table></div></div>
<div class="panel"><h2>科目设置</h2><p class="muted">满分用于计算得分率和薄弱科目分析；排名按原始总分计算。</p><div id="settings"></div><button id="saveSettings">保存科目设置</button></div></section></main>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script src="script.js"></script></body></html>
