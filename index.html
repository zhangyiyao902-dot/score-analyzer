<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>班主任班级成绩分析系统 4.4</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap">
<header><h1>班主任班级成绩分析</h1><p>单班成绩导入、排名与学生分析</p></header>
<section class="panel">
<h2>导入全班成绩</h2>
<label class="upload">选择 Excel / CSV 文件<input id="fileInput" type="file" accept=".xlsx,.xls,.csv"></label>
<p id="status" class="muted">请先设置科目，再导入成绩。</p>
</section>
<section class="panel">
<h2>科目设置</h2><div id="subjects"></div>
<button id="addSubject" class="primary">＋ 添加科目</button>
<p class="muted">科目名称和满分完全自定义，添加数量不限。Excel 表头需与科目名称对应。</p>
</section>
<section id="overview" class="panel hidden"></section>
<section id="studentSection" class="panel hidden">
<h2>学生查询</h2><input id="studentName" class="text" placeholder="输入学生姓名"><button id="searchBtn" class="primary">查询</button>
<div id="studentResult"></div>
</section>
<section id="rankSection" class="panel hidden"><h2>全班成绩排名</h2><select id="sortBy"></select><div class="tableWrap"><table id="rankTable"></table></div></section>
<section id="subjectSection" class="panel hidden"><h2>科目统计</h2><div class="tableWrap"><table id="subjectTable"></table></div></section>
<section id="focusSection" class="panel hidden"><h2>重点关注学生</h2><div id="focusList"></div></section>
<footer>成绩在浏览器本地处理；不会上传到本系统服务器。</footer>
</div>
<script src="script.js"></script>
</body></html>
