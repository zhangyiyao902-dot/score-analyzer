<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><title>班主任班级成绩分析系统</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="hero"><div><p class="eyebrow">班主任专用</p><h1>班级成绩分析系统</h1><p>导入一次全班成绩，快速查看班级和学生情况</p></div></header><section class="panel"><h2>① 设置考试科目</h2><div id="subjects"></div><button id="addSubject" class="secondary">＋ 添加科目</button></section><section class="panel"><h2>② 导入全班成绩</h2><label class="upload"><input id="fileInput" type="file" accept=".xlsx,.xls,.csv"><strong>选择 Excel / CSV 文件</strong><span>第一行为表头，需要包含“姓名”和已设置的科目</span></label><p id="status" class="status"></p></section><section id="overview" class="hidden"><div class="panel"><h2>③ 班级总览</h2><div class="stats" id="stats"></div><div id="subjectStats"></div></div><div class="panel"><h2>④ 查询学生</h2><div class="search"><input id="studentName" placeholder="输入学生姓名"><button id="searchBtn">查询</button></div><div id="studentResult"></div></div><div class="panel"><h2>⑤ 全班排名</h2><div class="tableWrap"><table><thead id="rankHead"></thead><tbody id="rankBody"></tbody></table></div></div><div class="panel"><h2>⑥ 重点关注</h2><div id="attention"></div></div></section><footer>成绩文件在浏览器本地处理，不上传到本系统服务器。首次使用 Excel 导入功能需要网络加载解析组件。</footer></main><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script src="script.js"></script></body></html>
